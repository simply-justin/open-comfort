name: Release

# Push a tag like v0.2.0 (release) or v0.3.0-beta.1 (pre-release). Devices on the matching
# channel find the attached opencomfort-<variant>.bin through Settings > Firmware.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1
    strategy:
      fail-fast: true
      matrix:
        include:
          - variant: ha-4mb
            defaults: sdkconfig.defaults
            matter: "OFF"
          - variant: matter-8mb
            defaults: sdkconfig.defaults;sdkconfig.matter.defaults;sdkconfig.8mb.defaults
            matter: "ON"
          - variant: matter-16mb
            defaults: sdkconfig.defaults;sdkconfig.matter.defaults
            matter: "ON"
          - variant: full-8mb
            defaults: sdkconfig.defaults;sdkconfig.matter.defaults;sdkconfig.full.defaults;sdkconfig.8mb.defaults
            matter: "ON"
          - variant: full-16mb
            defaults: sdkconfig.defaults;sdkconfig.matter.defaults;sdkconfig.full.defaults
            matter: "ON"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the firmware version comes from `git describe`

      - name: Build ${{ matrix.variant }}
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          idf.py -B build -D OPENCOMFORT_MATTER=${{ matrix.matter }} \
            -D SDKCONFIG=build/sdkconfig -D SDKCONFIG_DEFAULTS="${{ matrix.defaults }}" build

      - name: Check the version matches the tag
        shell: bash
        run: |
          version=$(python3 -c "import json;print(json.load(open('build/project_description.json'))['project_version'])")
          echo "Firmware version: $version"
          test "$version" = "$GITHUB_REF_NAME"

      # Devices only install images signed with the key of the firmware they run.
      - name: Sign the image
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.OPENCOMFORT_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::Secret OPENCOMFORT_SIGNING_KEY is not set; refusing to publish unsigned firmware"
            exit 1
          fi
          . "$IDF_PATH/export.sh"
          key="$RUNNER_TEMP/signing-key.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$SIGNING_KEY" > "$key")
          python -m espsecure sign_data --version 2 --keyfile "$key" \
            --output build/OpenComfort.signed.bin build/OpenComfort.bin
          python -m espsecure verify_signature --version 2 --keyfile "$key" build/OpenComfort.signed.bin

      - name: Name the image
        shell: bash
        run: |
          cp build/OpenComfort.signed.bin opencomfort-${{ matrix.variant }}.bin
          # For decoding crash backtraces from Settings > Logs (addr2line).
          cp build/OpenComfort.elf opencomfort-${{ matrix.variant }}.elf

      - uses: actions/upload-artifact@v4
        with:
          name: opencomfort-${{ matrix.variant }}
          path: |
            opencomfort-*.bin
            opencomfort-*.elf

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          # One zip for all ELF files: every asset adds to the release JSON devices read.
          zip -j opencomfort-elf.zip opencomfort-*.elf
          gh release create "$GITHUB_REF_NAME" opencomfort-*.bin opencomfort-elf.zip --generate-notes $flags
