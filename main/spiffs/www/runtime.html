<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenComfort</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <main class="shell">
    <header class="brand">
      <p class="brand__eyebrow">OpenComfort</p>
      <h1 id="title">Local control</h1>
      <p id="subtitle" class="lede">Control and configure this device on your local network.</p>
    </header>
    <oc-alert id="alert" hidden></oc-alert>

    <section id="loginPanel" class="panel">
      <div class="field">
        <label for="loginPassword">Portal password</label>
        <input id="loginPassword" type="password" autocomplete="current-password" />
      </div>
      <div class="actions">
        <button class="button-primary" id="loginButton" type="button">Sign in</button>
      </div>
    </section>

    <div id="dashboard" hidden>
      <section class="panel section">
        <h2 id="deviceName">Device</h2>
        <p id="status" class="muted">Loading state…</p>
        <div class="field checkbox-field">
          <label><input id="powerOn" type="checkbox" /> Power</label>
        </div>
        <div class="field">
          <label for="mode">Mode</label>
          <select id="mode">
            <option value="off">Off</option><option value="cool">Cool</option>
            <option value="heat">Heat</option><option value="dry">Dry</option>
            <option value="fan">Fan</option><option value="auto">Auto</option>
          </select>
        </div>
        <div class="field">
          <label for="targetTempC">Target temperature</label>
          <input id="targetTempC" type="number" step="0.5" />
        </div>
        <div class="field">
          <label for="fan">Fan speed</label>
          <select id="fan">
            <option value="auto">Auto</option><option value="low">Low</option>
            <option value="medium">Medium</option><option value="high">High</option>
          </select>
        </div>
        <div class="actions"><button class="button-primary" id="applyState" type="button">Apply</button></div>
      </section>

      <section class="panel section">
        <h2>Connectors</h2>
        <div class="field"><label for="friendlyName">Device name</label><input id="friendlyName" maxlength="32" /></div>
        <div class="field checkbox-field"><label><input id="mqttEnabled" type="checkbox" /> Home Assistant MQTT</label></div>
        <div class="field"><label for="mqttHost">MQTT broker</label><input id="mqttHost" maxlength="127" /></div>
        <div class="field"><label for="mqttPort">MQTT port</label><input id="mqttPort" type="number" min="1" max="65535" /></div>
        <div class="field checkbox-field"><label><input id="mqttTls" type="checkbox" /> Verify TLS</label></div>
        <div class="field"><label for="mqttUsername">New MQTT username (optional)</label><input id="mqttUsername" maxlength="64" autocomplete="username" /></div>
        <div class="field"><label for="mqttPassword">New MQTT password (optional)</label><input id="mqttPassword" type="password" maxlength="128" autocomplete="new-password" /></div>
        <div class="field checkbox-field" id="matterField"><label><input id="matterEnabled" type="checkbox" /> Matter</label></div>
        <div class="field"><label for="adminPassword">New portal password (optional)</label><input id="adminPassword" type="password" minlength="8" maxlength="64" autocomplete="new-password" /></div>
        <div class="actions">
          <button class="button-secondary" id="commissionMatter" type="button">Open Matter commissioning</button>
          <button class="button-primary" id="saveConnectors" type="button">Save and reboot</button>
        </div>
      </section>

      <section class="panel section">
        <h2>Replace Wi‑Fi</h2>
        <div class="field"><label for="wifiSsid">SSID</label><input id="wifiSsid" maxlength="32" /></div>
        <div class="field"><label for="wifiPassword">Password</label><input id="wifiPassword" type="password" maxlength="64" autocomplete="new-password" /></div>
        <div class="actions"><button class="button-primary" id="saveWifi" type="button">Save and reboot</button></div>
      </section>
    </div>
  </main>
  <script src="/js/runtime.js"></script>
</body>
</html>
